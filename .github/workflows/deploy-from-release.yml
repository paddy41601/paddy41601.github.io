name: Deploy Pages from Release (Flat to index.html)

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download release asset ZIP(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          # 依需要把 *.zip 換成更精準的 pattern（例如 website-*.zip 或 my-site.zip）
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.zip" \
            --dir release_assets \
            --clobber
          echo "Downloaded assets:"
          ls -lah release_assets

      - name: Unzip assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p site
          found=0
          for z in release_assets/*.zip; do
            found=1
            echo "Unzipping $z..."
            unzip -o "$z" -d site
          done
          if [ $found -eq 0 ]; then
            echo "No ZIP assets found in this release."
            exit 1
          fi
          echo "After unzip:"
          ls -la site || true

      - name: Flatten to the directory containing index.html (safe)
        shell: bash
        run: |
          set -euo pipefail

          # 找出所有 index.html，選擇「路徑層級最淺」的那個
          mapfile -t CANDIDATES < <(find site -type f -iname 'index.html' | awk -F/ '{print NF "\t"$0}' | sort -n | cut -f2-)
          if [ ${#CANDIDATES[@]} -eq 0 ]; then
            echo "❌ No index.html found anywhere under site/"
            find site -maxdepth 3 -print
            exit 1
          fi
          BEST_INDEX="${CANDIDATES[0]}"
          TARGET_DIR="$(dirname "$BEST_INDEX")"

          echo "Chosen index.html: $BEST_INDEX"
          echo "Target directory to flatten from: $TARGET_DIR"

          if [ "$TARGET_DIR" != "site" ]; then
            echo "Flatten via temp dir to avoid rsync overlap..."
            TMP_OUT="site_flat"
            rm -rf "$TMP_OUT"
            mkdir -p "$TMP_OUT"

            # 複製到暫存資料夾，再以它取代 site/，避免來源和目的地重疊
            rsync -a "$TARGET_DIR"/ "$TMP_OUT"/

            # 以乾淨的目錄替換掉舊的 site/
            rm -rf site
            mv "$TMP_OUT" site
          else
            echo "site/ already contains index.html at root; no flatten needed."
          fi

          # 建議加上 .nojekyll，避免 Jekyll 忽略底線開頭資源
          touch site/.nojekyll

          echo "Final site/ structure (top 2 levels):"
          find site -maxdepth 2 -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
